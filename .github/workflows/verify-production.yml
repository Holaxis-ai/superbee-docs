name: Reconcile and verify production documentation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superbee-docs-cloudflare-production
  cancel-in-progress: false

# Only the environment-bound acquire job can mint a hosted read token. Other workflows
# reuse its public export after this complete main production run succeeds (30-day retention).
# Push events redispatch because the workload app admits only dispatch and schedule.
jobs:
  redispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-run this workflow on main as a dispatch (the workload app admits no push event)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verify-production.yml --repo "$GITHUB_REPOSITORY" --ref main

  acquire:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: holaxis-sites-docs
    permissions:
      contents: read
      id-token: write
    outputs:
      tree_digest: ${{ steps.export.outputs.tree_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # This job can mint an OIDC token, so no dependency install script runs here.
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Export the hosted content, verified against the host's digest manifest
        id: export
        env:
          DOCS_HOSTED_APP_ID: ${{ vars.DOCS_HOSTED_APP_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hosted"
          node scripts/hosted-workload-token.mjs exec -- \
            node scripts/hosted-content.mjs export --to "$RUNNER_TEMP/hosted/export" --receipt "$RUNNER_TEMP/hosted/receipt.json"
          echo "tree_digest=$(jq -r .treeDigest "$RUNNER_TEMP/hosted/receipt.json")" >> "$GITHUB_OUTPUT"
          jq -r '"## Hosted content\n- bundle: `\(.bundle)`\n- revision: \(.revision), exported \(.exportedAt)\n- \(.documents) documents, \(.blobs) other files\n- tree: `\(.treeDigest)`"' \
            "$RUNNER_TEMP/hosted/receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the verified export to the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One name per run (not per attempt): re-running only build must find acquire's export.
          name: superbee-docs-hosted-content-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  build:
    needs: acquire
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && github.event_name != 'push' && needs.acquire.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Restore the verified hosted export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: superbee-docs-hosted-content-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted
      - name: Make .superbee exactly the hosted content
        env:
          TREE_DIGEST: ${{ needs.acquire.outputs.tree_digest }}
        run: node scripts/hosted-content.mjs materialize --from "$RUNNER_TEMP/hosted/export" --tree-digest "$TREE_DIGEST"
      - name: Build the exact immutable Portal artifact
        run: npm run repository-history:ensure && npm run portal:build
      - name: Prove Cloudflare can stage the completed deployment offline
        run: npm run cloudflare:check && npm run cloudflare:reconciliation:check
      - name: Hand off the exact completed Portal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superbee-docs-portal-${{ github.sha }}
          path: dist
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  reconcile:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Restore the exact completed Portal artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: superbee-docs-portal-${{ github.sha }}
          path: dist
      - name: Assemble the package-owned Cloudflare asset layer
        run: node scripts/deployment-assets.mjs
      - name: Prove the restored activation unit can stage offline
        run: npm run cloudflare:check && npm run cloudflare:reconciliation:check
      - name: Preflight production account, access, and robots policy
        id: preflight
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deployment-preflight.mjs --receipt deployment-preflight-receipt.json
      - name: Re-resolve the desired production commit
        id: desired
        shell: bash
        run: |
          git fetch --no-tags origin main
          echo "commit=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
      - name: Reconcile the exact artifact with Cloudflare
        if: steps.preflight.outcome == 'success'
        id: reconciliation
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Scheduled runs only compare live production with the exact artifact; publishing is a dispatch or a merge.
          RECONCILIATION_MODE: ${{ github.event_name == 'schedule' && 'probe' || 'deploy' }}
        run: >-
          node scripts/reconcile-cloudflare.mjs
          --mode "$RECONCILIATION_MODE"
          --repository "$GITHUB_REPOSITORY"
          --desired-commit "$GITHUB_SHA"
          --observed-commit "${{ steps.desired.outputs.commit }}"
          --receipt cloudflare-reconciliation-receipt.json
      - name: Verify Docs-specific production behavior
        id: verification
        continue-on-error: true
        run: >-
          node scripts/verify-production.mjs
          --receipt production-verification-receipt.json
          --source-repository "$GITHUB_REPOSITORY"
          --source-commit "$GITHUB_SHA"
          --attempts 3
          --delay-ms 15000
      - name: Preserve reconciliation and verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superbee-docs-production-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            deployment-preflight-receipt.json
            cloudflare-reconciliation-receipt.json
            production-verification-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Require verified reconciliation and Docs behavior
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          RECONCILIATION_OUTCOME: ${{ steps.reconciliation.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
        run: |
          test "$PREFLIGHT_OUTCOME" = success
          test "$RECONCILIATION_OUTCOME" = success
          test "$VERIFICATION_OUTCOME" = success
