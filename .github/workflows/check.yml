name: Check public documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check out the exact shared package verification producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Holaxis-ai/superbee
          ref: e41394a26f66ec3f1b0555b021fbd62db6f75834
          path: .deps/package-verification-source
          persist-credentials: false
      - name: Verify snapshot against actual pinned producer source
        run: node .deps/package-verification-source/packages/package-verification/export.mjs --source .deps/package-verification-source --target scripts/vendor/package-verification --check
      - name: Install locked dependencies through shared registry setup
        uses: Holaxis-ai/superbee/.github/actions/npm-ci@b6d790b07748ff496c6e53a42ddbe6c6bfd4493d
        with:
          npm-token: ${{ secrets.SUPERBEE_NPM_READ_TOKEN }}
          preflight-script: ci:dependencies
          ignore-scripts: 'false'
      - name: Restore public content from a verified main production export
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/hosted-content.mjs snapshot
      - run: npm run source:sync
      - name: Bootstrap the exact MkDocs environment
        run: |
          UV_VERSION=$(node --input-type=module -e 'import { MKDOCS_UV_VERSION_V1 } from "@superbee/docs-mkdocs"; process.stdout.write(MKDOCS_UV_VERSION_V1)')
          python -m pip install "uv==$UV_VERSION"
          npm run portal:build
          npm run mkdocs:sync
      - run: npm run check
      - name: Run the assistant's golden questions (deterministic mock)
        run: npm run assistant:eval
