name: Release documentation freshness

on:
  schedule:
    - cron: "19 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-documentation-freshness
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Prepare the resumable release review packet
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-conductor.mjs prepare > release-documentation-status.json
          cat release-documentation-status.json
          echo "status=$(jq -r .status release-documentation-status.json)" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync("release-documentation-status.json", "utf8"));
          console.log(`## Release documentation: ${result.status}`);
          console.log(`Version: ${result.version}. Packet: ${result.packetDigest}`);
          console.log(result.next);
          for (const page of result.affectedPages) console.log(`- ${page}`);
          NODE
      - name: Preserve the review packet even when preparation fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superbee-docs-release-review-${{ github.run_id }}
          path: |
            .tmp/release-conductor/packet.json
            .tmp/release-conductor/release.json
            .tmp/release-conductor/review.json
            .tmp/release-conductor/failure.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Require authored review for a new stable release
        if: steps.release.outputs.status == 'update_required'
        run: |
          echo "::error::A verified stable release requires authored review. Download the saved review packet; do not repeat release discovery."
          exit 1
